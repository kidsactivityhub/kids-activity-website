<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Pebbles - Ultimate Kids App</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #fff0f6;
            font-family: 'Arial', sans-serif; display: flex;
            justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }
        .app-box {
            width: 100%; max-width: 450px; height: 95vh; background: #ffffff;
            border-radius: 25px; box-shadow: 0px 12px 30px rgba(0,0,0,0.12);
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }
        .app-header {
            background: linear-gradient(135deg, #ff7ebb, #ff52a2); color: white;
            text-align: center; padding: 15px; font-size: 24px; font-weight: bold;
            letter-spacing: 1px; box-shadow: 0 4px 10px rgba(255,126,187,0.3);
        }
        .slider-container { flex: 1; position: relative; overflow: hidden; }
        .book-page {
            width: 100%; height: 100%; position: absolute; top: 0; left: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s;
            opacity: 0; padding: 20px; box-sizing: border-box; background: #fff;
            display: flex; flex-direction: column; align-items: center; overflow-y: auto;
        }
        .book-page.active { left: 0; opacity: 1; transform: scale(1) rotate(0deg); }
        .book-page.past { left: -100%; opacity: 0; transform: scale(0.95); }
        
        /* कार्टून और बड़े अक्षर का स्टाइल */
        .big-letter {
            font-size: 90px; font-weight: bold; color: #ff52a2; text-shadow: 3px 3px 0px #ffe3f0;
            margin: 10px 0; animation: bounce 2s infinite;
        }
        .object-pic { font-size: 70px; margin: 5px 0; }
        
        .voice-card {
            background: #e3f2fd; border-radius: 20px; padding: 15px 30px;
            text-align: center; font-size: 22px; font-weight: bold; color: #1e88e5;
            cursor: pointer; border: 2px solid #bbdefb; width: 80%;
            box-shadow: 0 5px 0 #90caf9; margin-top: 15px;
        }
        .voice-card:active { transform: translateY(5px); box-shadow: 0 0px 0 #90caf9; }
        
        /* कलर बटन */
        .color-tray { display: flex; gap: 15px; margin-top: 20px; }
        .paint-dot {
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
            border: 4px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        /* नंबर ग्रिड */
        .num-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin-top: 15px; }
        .num-button {
            background: #f1f8e9; border-radius: 15px; padding: 20px 10px; text-align: center;
            font-size: 24px; font-weight: bold; color: #558b2f; border: 2px solid #c5e1a5;
            box-shadow: 0 5px 0 #aed581; cursor: pointer;
        }
        .num-button:active { transform: translateY(5px); box-shadow: 0 0 0; }

        /* वीडियो कार्ड */
        .rhyme-card {
            width: 100%; background: #fffde7; border: 2px dashed #fbc02d;
            border-radius: 20px; padding: 12px; margin-bottom: 15px; box-sizing: border-box;
        }
        .rhyme-name { font-size: 16px; font-weight: bold; color: #f57f17; margin-bottom: 8px; }

        /* नीचे के बटन */
        .bottom-nav { display: flex; justify-content: space-between; padding: 15px 20px; background: #fafafa; border-top: 1px solid #eee; }
        .nav-action { background: #4caf50; color: white; border: none; padding: 12px 30px; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #388e3c; }
        .nav-action:active { transform: translateY(4px); box-shadow: 0 0 0; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="app-box">
    <div class="app-header">Magic Pebbles ✨</div>
    <div class="slider-container" id="main-slider"></div>
    <div class="bottom-nav">
        <button class="nav-action" style="background:#ff9800; box-shadow: 0 4px 0 #f57c00;" onclick="movePrev()">◀ पीछे</button>
        <button class="nav-action" onclick="moveNext()">आगे ▶</button>
    </div>
</div>

<script>
    // ए से जेड तक का पूरा इन-बिल्ट डेटा (बिना किसी बाहरी फोटो के झंझट के)
    const kidsData = {
        alphabet: [
            { letter: "A", word: "A for Apple", icon: "🍎" },
            { letter: "B", word: "B for Ball", icon: "⚽" },
            { letter: "C", word: "C for Cat", icon: "🐱" },
            { letter: "D", word: "D for Dog", icon: "🐶" },
            { letter: "E", word: "E for Elephant", icon: "🐘" },
            { letter: "F", word: "F for Fish", icon: "🐟" },
            { letter: "G", word: "G for Grapes", icon: "🍇" },
            { letter: "H", word: "H for Horse", icon: "🐴" },
            { letter: "I", word: "I for Ice-Cream", icon: "🍦" },
            { letter: "J", word: "J for Joker", icon: "🤡" },
            { letter: "K", word: "K for Kite", icon: "🪁" },
            { letter: "L", word: "L for Lion", icon: "🦁" },
            { letter: "M", word: "M for Monkey", icon: "🐒" },
            { letter: "N", word: "N for Nest", icon: "🪹" },
            { letter: "O", word: "O for Orange", icon: "🍊" },
            { letter: "P", word: "P for Parrot", icon: "🦜" },
            { letter: "Q", word: "Q for Queen", icon: "👸" },
            { letter: "R", word: "R for Rose", icon: "🌹" },
            { letter: "S", word: "S for Sun", icon: "☀️" },
            { letter: "T", word: "T for Tiger", icon: "🐯" },
            { letter: "U", word: "U for Umbrella", icon: "☂️" },
            { letter: "V", word: "V for Van", icon: "🚐" },
            { letter: "W", word: "W for Watch", icon: "⌚" },
            { letter: "X", word: "X for Xylophone", icon: "🎹" },
            { letter: "Y", word: "Y for Yak", icon: "🐂" },
            { letter: "Z", word: "Z for Zebra", icon: "🦓" }
        ],
        digits: [
            { n: "1", speak: "One Elephant" }, { n: "2", speak: "Two Balloons" },
            { n: "3", speak: "Three Stars" }, { n: "4", speak: "Four Cars" },
            { n: "5", speak: "Five Candies" }, { n: "6", speak: "Six Apples" },
            { n: "7", speak: "Seven Baseballs" }, { n: "8", speak: "Eight Butterflies" },
            { n: "9", speak: "Nine Cupcakes" }, { n: "10", speak: "Ten Balloons" }
        ],
        videos: [
            { name: "🎬 मछली जल की रानी है", link: "https://youtube.com" },
            { name: "🎬 चंदा मामा दूर के", link: "https://youtube.com" },
            { name: "🎬 ट्विंकल ट्विंकल लिटिल स्टार", link: "https://youtube.com" }
        ]
    };

    let activeIdx = 0;
    const mainView = document.getElementById('main-slider');

    function createAppStructure() {
        mainView.innerHTML = '';
        let htmlPages = [];

        // 1. A to Z पेजेस तैयार करना
        kidsData.alphabet.forEach((item, index) => {
            htmlPages.push(`
                <div class="book-page" id="bg-page-${item.letter}">
                    <h2 style="color:#ff52a2; font-size:20px; margin:0;">Learning & Coloring Page</h2>
                    <div class="big-letter">${item.letter}</div>
                    <div class="object-pic" id="pic-${item.letter}">${item.icon}</div>
                    <div class="voice-card" onclick="speakLikeGirl('${item.word}')">
                        ${item.word} 🔊
                    </div>
                    <div class="color-tray">
                        <div class="paint-dot" style="background: #ff7676;" onclick="paintBag('bg-page-${item.letter}', '#fff0f0')"></div>
                        <div class="paint-dot" style="background: #76b7ff;" onclick="paintBag('bg-page-${item.letter}', '#eef7ff')"></div>
                        <div class="paint-dot" style="background: #76ff91;" onclick="paintBag('bg-page-${item.letter}', '#f0fff4')"></div>
                    </div>
                </div>
            `);
        });

        // 2. Numbers पेज तैयार करना
        let numHtml = `<div class="book-page"><h2>Numbers (1 से 10)</h2><div class="num-grid">`;
        kidsData.digits.forEach(item => {
            numHtml += `<div class="num-button" onclick="speakLikeGirl('${item.speak}')">${item.n}<span style="font-size:11px; display:block; color:#777;">🔊 सुनिए</span></div>`;
        });
        numHtml += `</div></div>`;
        htmlPages.push(numHtml);

        // 3. पोएट्री वीडियो पेज तैयार करना
        let videoHtml = `<div class="book-page"><h2>बाल कविताएं (Poetry)</h2>`;
        kidsData.videos.forEach(vid => {
            videoHtml += `
                <div class="rhyme-card">
                    <div class="rhyme-name">${vid.name}</div>
                    <iframe width="100%" height="160" src="${vid.link}" frameborder="0" allowfullscreen style="border-radius:12px;"></iframe>
                </div>`;
        });
        videoHtml += `</div>`;
        htmlPages.push(videoHtml);

        mainView.innerHTML = htmlPages.join('');
        displayPage(activeIdx);
    }

    // बच्चों जैसी सुरीली/लड़की की आवाज़ निकालने की सेटिंग
    function speakLikeGirl(phrase) {
        window.speechSynthesis.cancel();
        let voiceMsg = new SpeechSynthesisUtterance(phrase);
        
        // उपलब्ध आवाज़ों को ढूंढकर फीमेल/लड़की की आवाज़ सेट करना
        let allVoices = window.speechSynthesis.getVoices();
        let girlVoice = allVoices.find(v => v.name.includes('Google US English') || v.name.includes('Zira') || v.lang.includes('en'));
        if (girlVoice) voiceMsg.voice = girlVoice;

        voiceMsg.lang = 'en-US';
        voiceMsg.rate = 0.8;  // बच्चों के लिए थोड़ा धीरे बोलना
